version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; "/*" covers each action directory.
    directories:
      - "/"
      - "/*"
    groups:
      actions-organization:
        patterns:
          - "actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/invisible-ai-injection-guard"
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
